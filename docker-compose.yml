services:
  # ── OpenClaw / ZeroClaw LLM containers ─────────────────────────────────────
  # These provide the LLM brain only. All Pakt platform integration is handled
  # by the psilocli-* sidecars. Set OPENCLAW_IMAGE to your local image name.
  #
  # LLM provider is configured per-agent via the root .env file:
  #   AGENT_A_LLM_BASE_URL   — API base URL  (e.g. https://api.openai.com)
  #   AGENT_A_LLM_MODEL      — model ID      (e.g. gpt-4o)
  #   AGENT_A_LLM_COMPAT     — openai | anthropic
  #   AGENT_A_LLM_API_KEY    — API key
  #   AGENT_A_LOCAL_MODEL    — provider/model passed to --model flag (e.g. openai/gpt-4o)
  # Same pattern for AGENT_B_*.

  agent-a:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-openclawubuntu:latest}
    container_name: agent-a
    command: /bin/sh -c "mkdir -p /root/.openclaw/plugins && chown -R root:root /root/.openclaw/plugins && exec /usr/local/bin/start-openclaw-a2a.sh"
    environment:
      OPENCLAW_GATEWAY_PORT: "18789"
      A2A_BRIDGE_PORT: "4120"
      OPENCLAW_HOOKS_PATH: "/hooks"
      OPENCLAW_HOOKS_TOKEN: "testtoken"
      CUSTOM_BASE_URL: "${AGENT_A_LLM_BASE_URL}"
      CUSTOM_MODEL_ID: "${AGENT_A_LLM_MODEL}"
      CUSTOM_COMPATIBILITY: "${AGENT_A_LLM_COMPAT:-openai}"
      CUSTOM_API_KEY: "${AGENT_A_LLM_API_KEY}"
      OPENCLAW_FORCE_ONBOARD: "false"
      OPENCLAW_CHANNEL_PAKT_DISABLE: "1"   # psilocli handles this
    ports:
      - "8800:8080"
      - "8801:80"
    volumes:
      - ./agents/agenta/claw:/root/.openclaw
      - ./agents/agenta/a2a:/root/.a2a-bridges
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  agent-b:
    build:
      context: .
      dockerfile: Dockerfile.openclaw
      args:
        OPENCLAW_IMAGE: ${OPENCLAW_IMAGE:-openclawubuntu:latest}
    container_name: agent-b
    command: /bin/sh -c "mkdir -p /root/.openclaw/plugins && chown -R root:root /root/.openclaw/plugins && exec /usr/local/bin/start-openclaw-a2a.sh"
    environment:
      OPENCLAW_GATEWAY_PORT: "18789"
      A2A_BRIDGE_PORT: "4120"
      OPENCLAW_HOOKS_PATH: "/hooks"
      OPENCLAW_HOOKS_TOKEN: "testtoken"
      CUSTOM_BASE_URL: "${AGENT_B_LLM_BASE_URL}"
      CUSTOM_MODEL_ID: "${AGENT_B_LLM_MODEL}"
      CUSTOM_COMPATIBILITY: "${AGENT_B_LLM_COMPAT:-openai}"
      CUSTOM_API_KEY: "${AGENT_B_LLM_API_KEY}"
      OPENCLAW_FORCE_ONBOARD: "false"
      OPENCLAW_CHANNEL_PAKT_DISABLE: "1"
    ports:
      - "8802:8080"
      - "8803:80"
    volumes:
      - ./agents/agentb/claw:/root/.openclaw
      - ./agents/agentb/a2a:/root/.a2a-bridges
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Pakt agent sidecars ─────────────────────────────────────────────────────
  # One per OpenClaw container. Handles WebSocket, escrow signing, scanning, reviews.
  #
  # Sandbox modes (SANDBOX_TYPE in agents/agenta/.env):
  #   openclaw — docker exec into the LLM container (Docker socket required, works now)
  #   hermes   — HTTP POST to channel-http plugin (uncomment HERMES_URL when ready)

  psilocli-a:
    build: .
    container_name: psilocli-a
    env_file: ./agents/agenta/.env
    environment:
      SANDBOX_TYPE: openclaw
      OPENCLAW_CONTAINER: agent-a
      OPENCLAW_LOCAL_MODEL: "${AGENT_A_LOCAL_MODEL}"
      # SANDBOX_TYPE: hermes
      # HERMES_URL: http://agent-a:8080/invoke
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - agent-a
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  psilocli-b:
    build: .
    container_name: psilocli-b
    env_file: ./agents/agentb/.env
    environment:
      SANDBOX_TYPE: openclaw
      OPENCLAW_CONTAINER: agent-b
      OPENCLAW_LOCAL_MODEL: "${AGENT_B_LOCAL_MODEL}"
      # SANDBOX_TYPE: hermes
      # HERMES_URL: http://agent-b:8080/invoke
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - agent-b
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
